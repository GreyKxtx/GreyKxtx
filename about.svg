<svg width="1020" height="350" viewBox="0 0 1020 350" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.12"/></linearGradient></defs>
<style>
.fi{opacity:0;animation:fi .5s ease forwards}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.cur{animation:bl 1.05s step-end infinite}@keyframes bl{50%{opacity:0}}
</style>
<rect width="1020" height="350" rx="10" fill="#000000"/>
<rect x="0.5" y="0.5" width="1019" height="349" rx="10" fill="none" stroke="#231C3D"/>
<text x="24" y="30" font-size="11" fill="#8B5CF6" letter-spacing="2.5">ABOUT</text>
<line x1="78.1" y1="26" x2="996" y2="26" stroke="url(#rule)"/>
<text x="996" y="30" text-anchor="end" font-size="10" fill="#8A8699">whoami</text>
<g class="fi" style="animation-delay:0.15s"><text x="24" y="62" font-size="13.5" fill="#2A2640">|</text><text x="44" y="62" font-size="13.5" fill="#FFFFFF">I build production systems where AI is the product, not a feature —</text></g>
<g class="fi" style="animation-delay:0.24s"><text x="24" y="86" font-size="13.5" fill="#2A2640">|</text><text x="44" y="86" font-size="13.5" fill="#FFFFFF">from agent orchestration and model serving to the interfaces people use.</text></g>
<text class="fi" x="24" y="110" font-size="13.5" fill="#2A2640" style="animation-delay:0.33s">|</text>
<g class="fi" style="animation-delay:0.42s"><text x="24" y="134" font-size="13.5" fill="#2A2640">|</text><text x="44" y="134" font-size="13.5" fill="#FFFFFF">Most of my work goes into Acro: an ecosystem of tools for businesses and</text></g>
<g class="fi" style="animation-delay:0.51s"><text x="24" y="158" font-size="13.5" fill="#2A2640">|</text><text x="44" y="158" font-size="13.5" fill="#FFFFFF">teams — coding and content agents, an information aggregator, an education</text></g>
<g class="fi" style="animation-delay:0.60s"><text x="24" y="182" font-size="13.5" fill="#2A2640">|</text><text x="44" y="182" font-size="13.5" fill="#FFFFFF">platform with a realtime AI tutor, and the infrastructure underneath them.</text></g>
<g class="fi" style="animation-delay:0.69s"><text x="24" y="206" font-size="13.5" fill="#2A2640">|</text><text x="44" y="206" font-size="13.5" fill="#FFFFFF">I design the architecture, write the backends, serve the models, ship the UI.</text></g>
<text class="fi" x="24" y="230" font-size="13.5" fill="#2A2640" style="animation-delay:0.78s">|</text>
<g class="fi" style="animation-delay:0.87s"><text x="24" y="254" font-size="13.5" fill="#2A2640">|</text><text x="44" y="254" font-size="13.5" fill="#FFFFFF">I care about systems that run locally and cheaply as much as ones that scale.</text></g>
<g class="fi" style="animation-delay:0.96s"><text x="24" y="278" font-size="13.5" fill="#2A2640">|</text><text x="44" y="278" font-size="13.5" fill="#FFFFFF">Much of my stack is built around local-first inference — vLLM, quantized</text></g>
<g class="fi" style="animation-delay:1.05s"><text x="24" y="302" font-size="13.5" fill="#2A2640">|</text><text x="44" y="302" font-size="13.5" fill="#FFFFFF">models on consumer GPUs — rather than renting someone else's API.</text></g>
<g class="fi" style="animation-delay:1.14s"><text x="24" y="332" font-size="12.5" fill="#8B5CF6">&gt;</text><text x="44" y="332" font-size="12.5" fill="#A78BFA">Open to<tspan fill="#2A2640">:</tspan></text><text x="120" y="332" font-size="12.5" fill="#8A8699">AI / backend collaborations - open source - hard engineering problems</text></g>
</svg>